name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - laravel
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arquiNelson-web/package-lock.json

      - name: Install dependencies
        working-directory: arquiNelson-web
        run: npm ci

      - name: Build
        working-directory: arquiNelson-web
        run: npm run build:pages

      - name: Copy SPA fallback
        run: cp arquiNelson-web/dist/arquiNelson-web/browser/index.html arquiNelson-web/dist/arquiNelson-web/browser/404.html

      - name: Disable Jekyll
        run: touch arquiNelson-web/dist/arquiNelson-web/browser/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: arquiNelson-web/dist/arquiNelson-web/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
