name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - laravel
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arquiNelson-web/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: arquiNelson-web
        run: npm ci

      - name: Build
        working-directory: arquiNelson-web
        run: npm run build:pages

      - name: Prepare Pages artifact
        run: |
          test -f arquiNelson-web/dist/arquiNelson-web/browser/index.html
          rm -rf site
          mkdir site
          cp -R arquiNelson-web/dist/arquiNelson-web/browser/. site/
          cp site/index.html site/404.html
          touch site/.nojekyll
          find site -maxdepth 2 -type f | sort | head -50

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
