<section class="blog-detail">
  <div class="container">
    <a class="back-link" routerLink="/blog">Volver al blog</a>

    <p class="error" *ngIf="error">{{ error }}</p>
    <p class="hint" *ngIf="loading">Cargando publicación...</p>

    <ng-container *ngIf="!loading && post">
      <header class="detail-header">
        <span class="date">{{ formatDate(post.publishedAt || post.createdAt) }}</span>
        <h1>{{ post.title }}</h1>
        <p class="excerpt" *ngIf="post.excerpt">{{ post.excerpt }}</p>
      </header>

      <div class="cover" *ngIf="post.coverImageUrl">
        <video
          *ngIf="isVideoUrl(post.coverImageUrl); else coverImage"
          [src]="post.coverImageUrl"
          controls
        ></video>
        <ng-template #coverImage>
          <img [src]="post.coverImageUrl" [alt]="post.title" />
        </ng-template>
      </div>

      <article class="content">
        <p *ngFor="let paragraph of splitParagraphs(post.content)">{{ paragraph }}</p>
        <p *ngIf="!post.content">Sin contenido.</p>
      </article>
    </ng-container>
  </div>
</section>
