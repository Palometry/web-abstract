<app-hero></app-hero>
<app-about [previewMode]="true" ctaLabel="Conocer mas" [ctaLink]="['/blog']"></app-about>
<section class="portfolio-collage" aria-label="Collage de portafolio">
  <div class="collage-shell">
    <div class="collage-heading">
      <span class="collage-eyebrow">Portafolio</span>
      <h2>Una mirada a nuestros proyectos recientes</h2>
    </div>
    <div class="collage-rows">
      <div class="collage-row" *ngFor="let row of collageRows; let rowIndex = index" [class.row-reverse]="row.reverse">
        <figure class="collage-tile collage-feature">
          <a
            class="tile-trigger"
            [routerLink]="['/project', getProjectRouteId(row.featured.project)]"
            [attr.aria-label]="'Ver proyecto ' + row.featured.title"
          >
            <img
              [src]="row.featured.src"
              [alt]="row.featured.alt"
              loading="lazy"
              (error)="onCollageError(rowIndex * 3 + (row.reverse ? row.stacked.length : 0))"
            />
            <div class="tile-caption">
              <strong>{{ row.featured.title }}</strong>
              <span>{{ row.featured.category }}</span>
            </div>
          </a>
        </figure>

        <div class="collage-stack" [class.stack-single]="row.stacked.length === 1">
          <figure class="collage-tile collage-compact" *ngFor="let item of row.stacked; let stackIndex = index">
            <a
              class="tile-trigger"
              [routerLink]="['/project', getProjectRouteId(item.project)]"
              [attr.aria-label]="'Ver proyecto ' + item.title"
            >
              <img
                [src]="item.src"
                [alt]="item.alt"
                loading="lazy"
                (error)="onCollageError(rowIndex * 3 + (row.reverse ? stackIndex : stackIndex + 1))"
              />
              <div class="tile-caption">
                <strong>{{ item.title }}</strong>
                <span>{{ item.category }}</span>
              </div>
            </a>
          </figure>
        </div>
      </div>
    </div>
    <div class="collage-footer" *ngIf="collageItems.length">
      <a class="collage-cta" [routerLink]="['/projects']">Ver mas proyectos</a>
    </div>
  </div>
</section>

<section class="home-contact-cta" aria-label="Llamado final a contacto">
  <div class="home-contact-cta__backdrop">
    <div class="home-contact-cta__content">
      <span class="home-contact-cta__eyebrow">Contacto</span>
      <h2>Contactanos para tu proyecto</h2>
      <p>Hablemos sobre tu proximo proyecto y encontremos la mejor forma de desarrollarlo juntos.</p>
      <a class="home-contact-cta__button" [routerLink]="['/contact']">Contactanos</a>
    </div>
  </div>
</section>
